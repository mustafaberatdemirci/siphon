name: Release

# Push a tag such as v1.0.0 and this builds both programs for Windows, Linux
# and macOS and publishes them as a GitHub release. A tag with a dash
# (v1.0.0-rc.1) is published as a pre-release, to try the release out.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: windows-amd64
          - os: macos-latest
            target: macos-universal
    # The window version needs cgo, so every system builds on its own runner
    # instead of cross-compiling (macOS builds both of its architectures on
    # one: Apple's compiler targets either). Linux has its own job below.
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ github.ref_name }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          ver="${VERSION#v}"
          name="siphon-${VERSION}-${TARGET}"
          mkdir -p "dist/$name"
          # The icon and version details Explorer shows, as a resource the
          # Go linker picks up from the package folder.
          winres() {
            (cd "$1" && go run github.com/tc-hib/go-winres@v0.3.3 simply --arch amd64 --out rsrc \
              --icon "$GITHUB_WORKSPACE/docs/icon.png" --manifest none \
              --product-name Siphon --product-version "$ver" --file-version "${ver%%-*}" \
              --file-description "$3" --original-filename "$2" \
              --copyright "Copyright (c) 2026 Mustafa Berat Demirci")
          }
          winres . siphon.exe "Siphon command line"
          winres cmd/siphon-gui siphon-gui.exe "Siphon"
          # The command line tool is static: no cgo, runs anywhere.
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o "dist/$name/siphon.exe" .
          # -H=windowsgui: no console window behind the window.
          go build -trimpath -ldflags "-s -w -X main.version=${VERSION} -H=windowsgui" -o "dist/$name/siphon-gui.exe" ./cmd/siphon-gui
          cp LICENSE README.md "dist/$name/"
          sh browser/pack.sh "dist/$name/browser"
          cd dist && 7z a -tzip "$name.zip" "$name" > /dev/null

      # One download for every Mac: both programs are universal binaries
      # (Apple Silicon and Intel), and the window version is Siphon.app.
      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          ver="${VERSION#v}"
          name="siphon-${VERSION}-${TARGET}"
          mkdir -p build "dist/$name"
          for arch in arm64 amd64; do
            CGO_ENABLED=0 GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o "build/siphon-$arch" .
            CGO_ENABLED=1 GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o "build/siphon-gui-$arch" ./cmd/siphon-gui
          done
          lipo -create -output "dist/$name/siphon" build/siphon-arm64 build/siphon-amd64

          app="dist/$name/Siphon.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          lipo -create -output "$app/Contents/MacOS/Siphon" build/siphon-gui-arm64 build/siphon-gui-amd64
          iconset=build/Siphon.iconset
          mkdir -p "$iconset"
          for s in 16 32 128 256 512; do
            sips -z $s $s docs/icon.png --out "$iconset/icon_${s}x${s}.png" > /dev/null
            sips -z $((s * 2)) $((s * 2)) docs/icon.png --out "$iconset/icon_${s}x${s}@2x.png" > /dev/null
          done
          iconutil -c icns "$iconset" -o "$app/Contents/Resources/Siphon.icns"
          cat > "$app/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>Siphon</string>
            <key>CFBundleDisplayName</key><string>Siphon</string>
            <key>CFBundleIdentifier</key><string>io.github.mustafaberatdemirci.siphon</string>
            <key>CFBundleExecutable</key><string>Siphon</string>
            <key>CFBundleIconFile</key><string>Siphon</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${ver%%-*}</string>
            <key>CFBundleVersion</key><string>${ver%%-*}</string>
            <key>LSMinimumSystemVersion</key><string>12.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST
          plutil -lint "$app/Contents/Info.plist"
          # Not notarized (that needs a paid Apple account), but signed
          # ad hoc: an unsigned app downloaded from the web is reported as
          # "damaged" instead of "from an unidentified developer".
          codesign --force --deep --sign - "$app"
          codesign --verify --deep "$app"
          cp LICENSE README.md "dist/$name/"
          sh browser/pack.sh "dist/$name/browser"
          # ditto keeps the app bundle intact; a .zip is what Finder opens.
          cd dist && ditto -c -k --keepParent "$name" "$name.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: siphon-${{ matrix.target }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error

  # Linux: the archive, and .deb and .rpm packages of the same programs.
  # Built on Debian 12 rather than the runner's newer Ubuntu: the window
  # version needs at least the glibc it was built with, and Debian 12's
  # (asking for 2.34) runs on Debian 12, Ubuntu 22.04, RHEL 9 and anything
  # newer.
  build-linux:
    name: build (${{ matrix.target }})
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-amd64
            arch: amd64
          - os: ubuntu-24.04-arm
            target: linux-arm64
            arch: arm64
    runs-on: ${{ matrix.os }}
    container: golang:1.27-bookworm
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ github.ref_name }}
      TARGET: ${{ matrix.target }}
      ARCH: ${{ matrix.arch }}
      # The version comes from the tag; the container's checkout belongs to
      # another user, which go's VCS stamping would refuse.
      GOFLAGS: -buildvcs=false
    steps:
      - uses: actions/checkout@v7

      # Fyne's GLFW builds its X11 and Wayland backends.
      - name: Install GUI build dependencies
        run: apt-get update && apt-get install -y gcc libgl1-mesa-dev xorg-dev libxkbcommon-dev libwayland-dev

      # build/linux is where packaging/linux/nfpm.yaml takes the programs
      # from.
      - name: Build
        run: |
          set -euo pipefail
          name="siphon-${VERSION}-${TARGET}"
          stage=build/linux
          mkdir -p "$stage" "dist/$name"
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o "$stage/siphon" .
          go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o "$stage/siphon-gui" ./cmd/siphon-gui
          sh browser/pack.sh "$stage/browser"
          cp -R "$stage/." "dist/$name/"
          cp LICENSE README.md "dist/$name/"
          cp docs/icon.png "dist/$name/siphon.png"
          (cd dist && tar czf "$name.tar.gz" "$name")

      # A newer build image would quietly leave the older systems out.
      - name: Check the glibc it needs
        run: |
          set -euo pipefail
          need=$(objdump -T build/linux/siphon-gui | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
          echo "siphon-gui needs $need"
          newest=$(printf '%s\n' "$need" GLIBC_2.34 | sort -V | tail -1)
          [ "$newest" = GLIBC_2.34 ] || { echo "newer than GLIBC_2.34, what packaging/linux/nfpm.yaml asks for"; exit 1; }

      - name: Packages
        run: |
          set -euo pipefail
          for p in deb rpm; do
            VERSION="${VERSION#v}" go run github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.47.0 \
              package -f packaging/linux/nfpm.yaml -p "$p" -t dist/
          done

      - uses: actions/upload-artifact@v7
        with:
          name: siphon-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
          if-no-files-found: error

  # The Firefox extension, signed by Mozilla (an "unlisted" add-on: not in
  # the add-on store, but it installs for good, where an unsigned one is a
  # temporary add-on gone at the next restart). Runs only when the
  # repository has the add-on store's API key as secrets (AMO_JWT_ISSUER,
  # AMO_JWT_SECRET; addons.mozilla.org -> Tools -> Manage API Keys), and not
  # for a pre-release: Mozilla signs each version number once.
  firefox:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.ref_name }}
      AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
      AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
    steps:
      - uses: actions/checkout@v7

      - name: Sign the Firefox extension
        if: env.AMO_JWT_ISSUER != '' && env.AMO_JWT_SECRET != '' && !contains(github.ref_name, '-')
        run: |
          set -euo pipefail
          ver="${VERSION#v}"
          sh browser/pack.sh build
          got=$(jq -r .version build/firefox/manifest.json)
          if [ "$got" != "$ver" ]; then
            echo "browser/manifest.firefox.json says $got, the tag $ver"; exit 1
          fi
          npx --yes web-ext@8.3.0 sign --source-dir build/firefox --artifacts-dir build/signed \
            --channel unlisted --api-key "$AMO_JWT_ISSUER" --api-secret "$AMO_JWT_SECRET" \
            --approval-timeout 900000
          mkdir -p dist
          cp build/signed/*.xpi "dist/siphon-firefox-${VERSION}.xpi"

      - uses: actions/upload-artifact@v7
        with:
          name: siphon-firefox
          path: dist/*.xpi
          if-no-files-found: ignore

  release:
    needs: [build, build-linux, firefox]
    runs-on: ubuntu-latest
    outputs:
      windows-sha256: ${{ steps.sums.outputs.windows }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        id: sums
        run: |
          set -euo pipefail
          cd dist && sha256sum * > SHA256SUMS.txt
          echo "windows=$(awk '/-windows-amd64\.zip$/ {print $1}' SHA256SUMS.txt)" >> "$GITHUB_OUTPUT"

      # The release text is this version's section of CHANGELOG.md (from its
      # "## <version>" heading to the next one; a pre-release such as
      # v1.0.0-rc.1 uses 1.0.0's); GitHub's list of changes is added below
      # it. Without a section, only that list.
      - name: Release notes
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          ver="${VERSION#v}"
          awk -v v="${ver%%-*}" '/^## /{on = ($2 == v); next} on' CHANGELOG.md > notes.md
          echo "release notes from CHANGELOG.md: $(grep -c . notes.md || true) lines"

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          body_path: notes.md
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}

  # The Scoop bucket (bucket/siphon.json on main) moves to the new version.
  # The script comes from the tag, so a tag pushed before its branch is
  # merged still finds it.
  scoop:
    needs: release
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.ref_name }}
      SHA256: ${{ needs.release.outputs.windows-sha256 }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: tag
          sparse-checkout: packaging

      - uses: actions/checkout@v7
        with:
          ref: main
          path: main

      - name: Update bucket/siphon.json
        working-directory: main
        run: |
          set -euo pipefail
          mkdir -p bucket
          sh ../tag/packaging/scoop.sh "${VERSION#v}" "$SHA256" > bucket/siphon.json
          git add bucket/siphon.json
          if git diff --cached --quiet; then echo "already up to date"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Scoop: Siphon ${VERSION#v}"
          git push origin HEAD:main

  # winget: the new version's manifests go to microsoft/winget-pkgs as a pull
  # request, which winget's moderators merge (the first version of a package
  # is reviewed by hand, later ones mostly by their checks). Runs only when
  # the repository has the secret WINGET_TOKEN: a classic GitHub token with
  # the public_repo scope, of the account whose fork of winget-pkgs
  # wingetcreate uses (it makes one if missing).
  winget:
    needs: release
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: windows-latest
    env:
      VERSION: ${{ github.ref_name }}
      SHA256: ${{ needs.release.outputs.windows-sha256 }}
      WINGET_CREATE_GITHUB_TOKEN: ${{ secrets.WINGET_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        if: env.WINGET_CREATE_GITHUB_TOKEN != ''
        with:
          sparse-checkout: packaging

      - name: Submit to winget-pkgs
        if: env.WINGET_CREATE_GITHUB_TOKEN != ''
        shell: bash
        run: |
          set -euo pipefail
          ver="${VERSION#v}"
          sh packaging/winget.sh "$ver" "$SHA256" build/winget
          curl -fsSL -o wingetcreate.exe https://github.com/microsoft/winget-create/releases/download/v1.12.13.0/wingetcreate.exe
          echo "24042bd37915805615e6cf969ac57c6439124c3fe85823327f5f3fb24bd9ffea  wingetcreate.exe" | sha256sum -c -
          # The token comes from WINGET_CREATE_GITHUB_TOKEN, not the command
          # line, where it could be logged.
          ./wingetcreate.exe submit --no-open --prtitle "MustafaBeratDemirci.Siphon version $ver" build/winget
