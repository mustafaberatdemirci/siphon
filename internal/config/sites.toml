# Siphon gömülü site tanımları.
#
# Bu dosya go:embed ile binary'ye gömülür. Dış bir kopya bulunursa (arama sırası:
# -c bayrağı, exe'nin yanı, cwd) üzerine BİNDİRİLİR, tamamen değiştirmez:
#   - skaler alanlar ezilir
#   - dizi alanları BİRLEŞİR (union, sıra korunur)
#   - silme yalnızca domains_remove / cdn_patterns_remove ile açıkça yapılır
#
# Yani yeni bir TLD çıktığında tüm listeyi yeniden yazman gerekmez, tek satır
# eklersin. Premise 2'nin satış argümanı bu.

schema_version = 1

[[site]]
name = "pixeldrain"

# 2026-09-09'da yedisi de canlı ölçüldü: hepsi 200 + temiz JSON döndü ve
# hiçbiri operatör engelinde değil. Kaynak: cyberdrop-dl supported-websites.md,
# ardından /api/misc/rate_limits ile teker teker doğrulama.
domains = [
  "pixeldrain.com",
  "pixeldra.in",
  "pixeldrain.net",
  "pixeldrain.nl",
  "pixeldrain.dev",
  "pixeldrain.biz",
  "pixeldrain.tech",
]

legacy_domains = []

# pixeldrain kendi dosyalarını kendi domaininden veriyor, ayrı bir CDN host'u yok.
cdn_patterns = []

# Referer YOK. pixeldrain'de yanlış Referer tam olarak hotlink_detected tetikler;
# ücretsiz hesapta hotlinking yasak. Bu alan site başına politikadır.
referer_policy = "none"

user_agent = "siphon/0.1 (+https://github.com/mustafaberatdemirci/siphon)"

# Ücretsiz hesapta eşzamanlı bağlantı sınırı var; max_concurrent_downloads
# hatasını kendi elinle tetiklememek için düşük tutuluyor.
max_concurrent = 3

# Canary bir LİSTEDİR. Tek canary'ye bağlanan doctor, o domain engellenirse
# çalışır durumdaki siteyi "ölü" raporlar. Ölçüm bunun bunkr'da gerçekten
# olduğunu gösterdi.
canary_urls = [
  "https://pixeldrain.com/api/misc/rate_limits",
  "https://pixeldra.in/api/misc/rate_limits",
  "https://pixeldrain.net/api/misc/rate_limits",
]

max_retries = 5
base_delay = "1s"
max_delay = "60s"
max_elapsed = "10m"

[[site]]
name = "bunkr"

# SIRA ÖNEMLİ: rotasyon listenin başından başlıyor. 2026-09-09 ölçümüne göre
# bunkr.ws bu ağdan temiz 200 dönen tek domain, o yüzden başta.
#
# Ölçüm sonuçları:
#   bunkr.ws     -> 200, challenge yok          (çalışıyor)
#   bunkr.black  -> 403, CF-Mitigated: challenge (Cloudflare)
#   bunkr.cr     -> 2a01:358:... blok sayfası    (operatör engeli)
#   bunkr.si     -> aynı                          (operatör engeli)
#   bunkr.ph     -> bağlantı zaman aşımı          (operatör engeli)
#   bunkr.fi     -> bağlantı zaman aşımı          (operatör engeli)
#
# Bilinen kötüler listeden ÇIKARILMADI: engel ağa göre değişiyor, başka bir
# bağlantıda çalışabilirler. Sadece sona alındılar; ilk denemede elenip
# rotasyon devam ediyor.
domains = [
  "bunkr.ws",
  "bunkr.ac",
  "bunkr.ci",
  "bunkr.pk",
  "bunkr.ps",
  "bunkr.sk",
  "bunkr.red",
  "bunkr.media",
  "bunkr.site",
  "bunkr.black",
  "bunkr.cr",
  "bunkr.si",
  "bunkr.ph",
  "bunkr.fi",
]

# Ölü domainler: URL'de TANINIR ama istek atılmaz.
legacy_domains = [
  "bunkr.ax", "bunkr.cat", "bunkr.ru", "bunkrr.ru",
  "bunkr.su", "bunkrr.su", "bunkr.la", "bunkr.is", "bunkr.to",
]

# Joker yalnızca TANIMA için. Rotasyon somut listeyi kullanıyor çünkü jokerle
# rastgele bir domain seçemezsin. İkisi birlikte: yeni bir TLD çıktığında link
# tanınır, istek bilinen bir domaine gider.
match_patterns = ["bunkr.*", "bunkrr.*"]

# bunkr CDN host'ları dönüyor; bu liste bir kapı değil SİNYAL. Listede olmayan
# bir host indirmeyi durdurmaz, doctor WARN basar ve "sites.toml'a ekle" der.
#
# 2026-09-09'da tek bir albümde altı farklı host görüldü: c3bc-b, c3su-b,
# c1be-b, c2ch-b, c2ri-b, c2rm-b, hepsi .cdn.cr altında. Tek tek saymak
# anlamsız; joker kalıp doğru çözüm. Yeni bir kök domain çıkarsa doctor WARN
# basıp söyleyecek.
cdn_patterns = ["*.cdn.cr"]

# Sayfa isteklerinde Referer YOK. İndirme isteğinin Referer'ı ise politikadan
# değil PROTOKOLDEN geliyor: API endpoint'i <dl_origin>/file/<id> Referer'ını
# ve Origin'ini zorunlu kılıyor, bu yüzden Item.Headers'a açıkça yazılıyor.
# Host'u buraya YAZMIYORUZ: dl_origin değiştiğinde bu yorum bayatlamasın.
referer_policy = "none"

user_agent = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0 Safari/537.36"

# bunkr CDN'i pixeldrain'den toleranslı ama abartmanın anlamı yok.
max_concurrent = 4

# Canary site kökü. Bir ALBÜM adresi eklersen doctor'ın Parse katmanı da
# doğrulanır; kök sayfa albumFiles taşımadığı için şu an Parse WARN basıyor.
canary_urls = [
  "https://bunkr.ws/",
  "https://bunkr.ac/",
  "https://bunkr.ci/",
]

max_retries = 5
base_delay = "2s"
max_delay = "60s"
max_elapsed = "10m"

# bunkr'ın en çok değişen değerleri. 2025-02'de indirme adresi HTML'deki
# <source src> alanındaydı; 2025-03'te get.bunkrr.su/api/vs oldu; sonra
# apidl.bunkr.ru/api/_001_v2; 2026-09-10 itibarıyla dl.bunkr.cr/api/_001_v2
# ve AYRICA bir imza servisi. Kod değiştirmeden güncellenebilmeleri için
# config'te.
#
# ÖLÇÜM 2026-09-10: apidl.bunkr.ru hâlâ 200 dönüyor ama BAYAT yol veriyor
# (".../dosya.m4v" derken güncel API ".../storage/media/dosya.m4v" diyor).
# Yani eski uca bakıp "çalışıyor" demek yanıltıcıydı; adres çözülüyor,
# indirme 403 alıyordu.
#
# sign_endpoint OLMADAN her indirme 403 alır. CDN imzasız isteği dosyaya hiç
# bakmadan reddediyor: var olmayan bir dosya adı için yanıt bayt bayt aynı.
[site.extra]
api_endpoint = "https://dl.bunkr.cr/api/_001_v2"
dl_origin = "https://dl.bunkr.cr"
sign_endpoint = "https://glb-apisign.cdn.cr/sign"
xor_key_prefix = "SECRET_KEY_"

# YEDEK UÇ. Birincil uca ULAŞILAMADIĞINDA kullanılıyor; sunucunun verdiği
# gerçek bir yanıt (400 "silinmiş" gibi) yedeği tetiklemez.
#
# ÖLÇÜM 2026-09-10: bu bağlantıda dl.bunkr.cr operatör tarafından DNS
# seviyesinde ele geçiriliyor (195.175.254.2 = engel sayfası, 443 yanıt
# vermiyor), apidl.bunkr.ru ise açık. Yedek olmadan bunkr yalnızca VPN ile
# çalışıyordu.
fallback_api_endpoint = "https://apidl.bunkr.ru/api/_001_v2"

# Yedek uç aynı dosya için ".../dosya.m4v" derken güncel uç
# ".../storage/media/dosya.m4v" diyor; fark bu ön ek. Üç ayrı CDN düğümünde,
# iki albümde imzalanıp 206 alınarak doğrulandı (2026-09-10). Yine de bir
# TAHMİN: güncel uca ulaşılabildiğinde gerçek yolu sunucu söylüyor ve bu
# değer hiç kullanılmıyor.
legacy_path_prefix = "/storage/media"
